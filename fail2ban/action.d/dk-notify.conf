# fail2ban action: a notification to your phone when an IP is banned (dk-notify).
# Copied to /etc/fail2ban/action.d/ by install.sh and used only by the nginx-limit-req jail
# (someone keeps hammering an app's login rate limit) – bans of SSH bots and
# scanners happen every day and only appear in the weekly report.
[Definition]
# no message for bans that fail2ban restores after a restart/reboot (they were reported already)
norestored = 1
actionstart =
actionstop =
actioncheck =
actionban = /usr/local/sbin/dk-notify "Login attacker banned: <ip>" "<ip> kept hitting a login's rate limit (<failures> times) and is banned for <bantime> seconds (fail2ban jail <name>)." default no_entry
actionunban =
