# Requests for things none of the sites have and only attack scanners ask for:
# PHP files, WordPress pages, hidden .env/.git files.
# Copied to /etc/fail2ban/filter.d/ by install.sh.
[Definition]
failregex = ^<HOST> -[^"]*"(?:GET|POST|HEAD|PUT|DELETE|OPTIONS) [^"]*(?:\.php|/wp-(?:admin|login|content|includes)|/\.env|/\.git)[^"]*"
ignoreregex =
