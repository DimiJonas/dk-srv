# Installed by dk-srv hardening/install-hardening.sh (part "postgres") into the cluster's conf.d/.
# CIS PostgreSQL 16 Benchmark,
# - every connection and disconnection is logged (who, which database, from where)
# - pgAudit logs changes to tables/structure (ddl) and to roles/rights (role) – not the app's
#   normal reading and writing (that would be the memories' contents)
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d %h '
shared_preload_libraries = 'pgaudit'
pgaudit.log = 'ddl,role'
pgaudit.log_catalog = off
pgaudit.log_parameter = off
