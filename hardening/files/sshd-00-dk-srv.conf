# SSH server settings of the server – installed by dk-srv hardening/install-hardening.sh
# (part "ssh") as /etc/ssh/sshd_config.d/00-dk-srv.conf. CIS Ubuntu 24.04 Level 1.
# In sshd the FIRST value wins, so this file starts with "00" (Ubuntu may have a 50-cloud-init.conf
# that allows passwords).

# Who and how: only appuser, only with a key
AllowUsers @ADMIN_USER@
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
HostbasedAuthentication no
IgnoreRhosts yes
GSSAPIAuthentication no
PermitUserEnvironment no
UsePAM yes

# Limits: 4 tries per connection, 60 s to log in, at most 10 unauthenticated connections
# (after that, 30 % of new ones are refused, all of them from 60 on)
MaxAuthTries 4
LoginGraceTime 60
MaxStartups 10:30:60
MaxSessions 10

# A connection whose other end is gone is closed after 45 s (15 s × 3 unanswered checks).
# Idle shells close themselves after 15 minutes (TMOUT, part "accounts").
ClientAliveInterval 15
ClientAliveCountMax 3

# No tunnels, no X11, no agent forwarding – not needed here (rsync/scp/sftp still work)
DisableForwarding yes
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no

LogLevel INFO
Banner /etc/issue.net

# Only modern algorithms (the values the CIS audit checks for)
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
