# Installed by dk-srv hardening/install-hardening.sh as /etc/default/grub.d/60-dk-srv-cis.cfg
# (then update-grub; takes effect after the next restart). CIS Ubuntu 24.04: AppArmor switched on
# explicitly (Level 1); the audit system records from the very start of booting (Level 2: audit=1
# and audit_backlog_limit are added only once the part "auditd" is installed).
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX apparmor=1 security=apparmor@AUDIT@"
