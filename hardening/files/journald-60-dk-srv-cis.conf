# Installed by dk-srv hardening/install-hardening.sh (part "logging") as
# /etc/systemd/journald.conf.d/60-dk-srv-cis.conf. CIS Ubuntu 24.04 Level 1,
# the journal is kept on disk, compressed, passed on to rsyslog (/var/log/syslog, auth.log) –
# and limited to 1 GB (it was growing without limit).
[Journal]
Storage=persistent
Compress=yes
ForwardToSyslog=yes
SystemMaxUse=1G
