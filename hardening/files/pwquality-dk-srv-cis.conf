# Password rules for new passwords (e.g. `passwd`, appuser's sudo password) – put by
# dk-srv hardening/install-hardening.sh (part "pam") as a marked block at the end of
# /etc/security/pwquality.conf. CIS Ubuntu 24.04 Level 1, at least 14 characters with
# digits, upper and lower case letters and other characters, no long repetitions or sequences, no
# dictionary words. (Not in pwquality.conf.d/: PAM would read it there, but the CIS audit only
# reads pwquality.conf itself.)
minlen = 14
minclass = 4
dcredit = -1
ucredit = -1
lcredit = -1
ocredit = -1
maxrepeat = 3
maxsequence = 3
difok = 2
dictcheck = 1
enforcing = 1
# also when root sets a password (e.g. sudo passwd appuser) – a line of its own, without "= 1"
enforce_for_root
retry = 3
