# Installed by dk-srv hardening/install-hardening.sh (part "aide") as
# /etc/systemd/system/dailyaidecheck.service.d/60-dk-srv.conf – changes Ubuntu's daily AIDE
# service (aide-common) to run dk-srv's check instead of Ubuntu's script:
# /usr/local/sbin/dk-aide-check (dk-srv bin/, installed by install.sh) sorts
# every change into explained/sensitive/other and notifies the phone; Ubuntu's script would mail
# root (there's no mail on this server). Log: /var/log/dk-srv/aide-check.log; errors also in
# `journalctl -u dailyaidecheck`.
[Unit]
Description=daily file integrity check (AIDE, via dk-aide-check)

[Service]
# Ubuntu's service runs as the user _aide with the right to read every file; ours renews the
# database, notes the package state and sends notifications – it runs as root
User=root
Group=root
AmbientCapabilities=
# not installed yet (dk-srv install.sh not run): skip quietly instead of failing
ExecCondition=/usr/bin/test -x /usr/local/sbin/dk-aide-check
ExecStart=
ExecStart=/usr/local/sbin/dk-aide-check
# reading every file shouldn't slow the apps down
Nice=10
IOSchedulingClass=idle
# the summary is in the log file; only error messages go to the journal
StandardOutput=null
