# Kernel modules this server never needs – installed by dk-srv hardening/install-hardening.sh (part
# "kernel") as /etc/modprobe.d/dk-srv-cis.conf. CIS Ubuntu 24.04 Level 1.
# Rare filesystems, USB storage and rare network protocols can't be loaded ("install … /bin/false").
# Not here: squashfs (snaps, e.g. Livepatch, need it) and overlay.
install cramfs /bin/false
blacklist cramfs
install freevxfs /bin/false
blacklist freevxfs
install hfs /bin/false
blacklist hfs
install hfsplus /bin/false
blacklist hfsplus
install jffs2 /bin/false
blacklist jffs2
install udf /bin/false
blacklist udf
install usb-storage /bin/false
blacklist usb-storage
install dccp /bin/false
blacklist dccp
install sctp /bin/false
blacklist sctp
install rds /bin/false
blacklist rds
install tipc /bin/false
blacklist tipc
