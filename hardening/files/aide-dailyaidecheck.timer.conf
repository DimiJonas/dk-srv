# Installed by dk-srv hardening/install-hardening.sh (part "aide") as
# /etc/systemd/system/dailyaidecheck.timer.d/60-dk-srv.conf – Ubuntu's daily AIDE timer at a
# fixed time: 05:40, after the nightly security check (05:10) and the updates it installs, so it
# knows which changes came from those. (Ubuntu's own time: around 01:50 plus up to 2 hours.)
# If the server was off at 05:40, the check runs right after the start (Persistent=true, Ubuntu's).
[Timer]
OnCalendar=
OnCalendar=*-*-* 05:40:00
RandomizedDelaySec=0
