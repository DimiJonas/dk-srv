# A small static website – TEMPLATE in the repository. nginx/install-nginx.sh fills it in for every
# /etc/dk-srv/sites.d/<name>.conf and installs it as /etc/nginx/sites-available/static-<name>,
# served from /var/www/<name> (its files: sudo dk-site-update <name>). The name must be in the
# certificate (CERT_NAME); the other names (ALIASES) are only answered on http:// and sent on to
# https://<name>.
#
# Hardened for a site that only shows files (HARDENING.md, "Static sites"):
# - only GET/HEAD, no uploads, no hidden files, no folder listings, no symbolic links (a link
#   to a file elsewhere on the server is refused, not followed)
# - only these file types are served as what they are: HTML, CSS, JPEG, PNG, WebP, AVIF, icons,
#   text. SVG is left out on purpose (it can contain scripts); anything else is sent as
#   "application/octet-stream" (a download, never shown or run)
# - Content-Security-Policy: no scripts at all, pictures and styles only from this site, no forms,
#   no frames; nosniff: browsers never guess a type – a "picture" that is really HTML or a script
#   stays a (broken) picture
# - a missing file is a plain 404, nothing else
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @NAME@;

    root @ROOT@;
    client_max_body_size 1k;
    disable_symlinks on;
    autoindex off;
    charset utf-8;

    types {
        text/html  html;
        text/css   css;
        text/plain txt;
        image/jpeg jpg jpeg;
        image/png  png;
        image/webp webp;
        image/avif avif;
        image/x-icon ico;
    }
    default_type application/octet-stream;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # the start page is index.html – a folder without it is a 404, never a listing
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri =404;
    }

    # .htaccess, .git, … are never served
    location ~ /\. {
        return 404;
    }

    ssl_certificate /etc/letsencrypt/live/@CERT@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@CERT@/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name @NAME@@ALIASES@;

    if ($host = @NAME@) {
        return 301 https://$host$request_uri;
    }
    return 301 https://@NAME@$request_uri;
}
