# Installed by nginx/install-nginx.sh as /etc/nginx/conf.d/dk-srv-hardening.conf – settings for
# all sites on this server. CIS NGINX Benchmark.

# Don't show the nginx version (headers and error pages) – also on other sites
server_tokens off;

# Slow or stalled clients are disconnected (they would otherwise keep connections busy)
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
keepalive_timeout 10s;

# At most 50 connections at the same time from one IP address (a browser uses about 6)
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;
limit_conn per_ip_conn 50;
limit_conn_status 429;
