# Installed by nginx/install-nginx.sh as /etc/nginx/sites-available/default-deny (and switched on).
# Every request that doesn't name one of our sites – scanners trying the bare IP address or
# made-up names – gets no answer at all: HTTP connections are closed (444), HTTPS handshakes are
# refused before any certificate is shown (so the certificate's names aren't given away).
# Replaces Ubuntu's "default" site. CIS NGINX Benchmark.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
