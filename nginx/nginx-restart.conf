# nginx starts again by itself if it stops or fails to start – installed by nginx/install-nginx.sh
# as /etc/systemd/system/nginx.service.d/60-dk-srv-restart.conf.
#
# Why: when an update restarts nginx (e.g. a new libc or OpenSSL: needrestart restarts every
# service using it), nginx can fail to start for a moment – on 2026-11-14 the name resolution was
# restarted in the same second, and nginx stayed down for 20 hours. Now it tries again after
# 30 seconds, at most 5 times in 5 minutes; after that it stays "failed" (a real mistake in the
# config won't fix itself) and dk-site-watch notifies.
#
# dk-srv's lockdown (dk-mode) is unaffected: a stopped and masked nginx is never started again.
#
#   systemctl show -p Restart -p RestartUSec -p StartLimitBurst nginx     the settings in effect

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=30s
